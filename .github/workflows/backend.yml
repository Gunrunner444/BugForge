name: Backend CI

on:
  workflow_call:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Run ruff lint
        working-directory: backend
        run: ruff check app/ tests/ --output-format=github

  format:
    name: Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Check ruff formatting
        working-directory: backend
        run: ruff format --check app/ tests/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Run tests with coverage
        working-directory: backend
        run: pytest tests/ --cov=app --cov-report=term-missing -v
      - name: Require applicability-module coverage
        working-directory: backend
        run: >
          pytest tests/test_phase64/test_applicability_and_identity.py
          --cov=app.discovery.bounty.applicability
          --cov-report=term-missing
          --cov-fail-under=95
          -q

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Run mypy type check
        working-directory: backend
        run: mypy app/ --ignore-missing-imports

  stateful-integration:
    name: Stateful integration (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Install Foundry 1.8.5
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Install solc 0.8.28
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # Published checksum from https://binaries.soliditylang.org/linux-amd64/list.json
          url="https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.28+commit.7893614a"
          expected="9a0fb7e0db2c0641dbae1c5cc645dc686820c83af516226abb1c0a2f76636f25"
          curl -fsSL -o "$HOME/.local/bin/solc" "$url"
          echo "${expected}  $HOME/.local/bin/solc" | sha256sum -c -
          chmod 755 "$HOME/.local/bin/solc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install solc 0.8.15
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bugforge/solc/0.8.15"
          # Published checksum from https://binaries.soliditylang.org/linux-amd64/list.json
          url="https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.15+commit.e14f2714"
          expected="5189155ce322d57fb75e8518d9b39139627edea4fb25b5f0ebed0391c52e74cc"
          curl -fsSL -o "$HOME/.bugforge/solc/0.8.15/solc" "$url"
          echo "${expected}  $HOME/.bugforge/solc/0.8.15/solc" | sha256sum -c -
          chmod 755 "$HOME/.bugforge/solc/0.8.15/solc"
          "$HOME/.bugforge/solc/0.8.15/solc" --version | grep "0.8.15"
          # PATH keeps solc 0.8.28 for the existing integration suite.
          solc --version | grep "0.8.28"
      - name: Require the executor to see forge and solc
        working-directory: backend
        run: |
          echo "forge=$(command -v forge)"
          echo "solc=$(command -v solc)"
          test -x "$(command -v forge)"
          test -x "$(command -v solc)"
          forge --version
          solc --version
          python - <<'PY'
          from pathlib import Path
          from app.discovery.process import tool_path
          from app.discovery.bounty.stateful import tool_status
          forge, solc = tool_path("forge"), tool_path("solc")
          status = tool_status()
          if not forge or not solc or not Path(forge).is_file() or not Path(solc).is_file():
              raise SystemExit(f"executor cannot see forge/solc: {forge!r} {solc!r}")
          if not status.available:
              raise SystemExit(f"tool status is not available: {status.as_dict()}")
          print(status.as_dict())
          PY
      - name: Run stateful integration tests
        working-directory: backend
        env:
          BUGFORGE_REQUIRE_FOUNDRY: "1"
          FOUNDRY_OFFLINE: "true"
          FOUNDRY_FFI: "false"
        run: |
          pytest \
            tests/test_phase52/test_source_identity.py \
            tests/test_phase52/test_supported_property_campaigns.py \
            tests/test_phase52/test_swallowed_call_campaign.py \
            tests/test_phase52/test_swallowed_call_v3_corrections.py::test_mechanism_probe_is_not_a_security_violation \
            tests/test_phase52/test_swallowed_call_v3_corrections.py::test_swallowed_call_candidate_reaches_the_existing_harness \
            tests/test_phase52/test_stateful_execution.py \
            tests/test_phase52/test_evidence_graph_and_quality.py \
            tests/test_phase52/test_multi_contract_harness.py \
            tests/test_phase52/test_protocol_modules.py \
            tests/test_phase52/test_research_api_mcp.py \
            tests/test_phase52/test_benchmark.py::test_stateful_twins_agree_with_their_expected_outcomes \
            tests/test_phase52/test_campaign_stateful.py::test_a_source_changed_after_analysis_is_an_identity_mismatch \
            tests/test_phase55/test_identity_contract.py \
            tests/test_phase55/test_model_provenance.py \
            tests/test_phase55/test_multifile_campaign.py \
            tests/test_phase56/test_compile_failure_campaign.py \
            tests/test_phase56/test_campaign_consistency.py \
            tests/test_phase56/test_source_truth.py::test_an_out_of_scope_path_is_excluded_before_execution \
            tests/test_phase57/test_compiler_resolution.py \
            tests/test_phase57/test_scope_selection.py \
            tests/test_phase57/test_skip_persistence.py \
            tests/test_phase58/test_constructor_profile.py \
            tests/test_phase58/test_profile_campaign.py \
            tests/test_phase58/test_comet_pause_campaign.py \
            tests/test_phase59/test_authorization_oracle.py \
            tests/test_phase59/test_profile_types.py \
            tests/test_phase59/test_constructor_sequence.py \
            tests/test_phase59/test_ci_comet_required.py \
            tests/test_discovery_conservation \
            tests/test_discovery_authorization \
            tests/test_phase60 \
            tests/test_phase61 \
            tests/test_phase62 \
            tests/test_phase63 \
            tests/test_phase64 \
            tests/test_phase65 \
            tests/test_phase66 \
            tests/test_phase67 \
            -vv --tb=short

  compound-integration:
    name: Compound integration (pinned Comet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned Compound Comet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: compound-finance/comet
          ref: f766f51583c23acc33b2a7824654ef2029a96804
          path: comet-pin
      - name: Verify the pinned Comet commit and sources
        run: |
          set -euo pipefail
          test "$(git -C comet-pin rev-parse HEAD)" = "f766f51583c23acc33b2a7824654ef2029a96804"
          test -f comet-pin/contracts/CometWithExtendedAssetList.sol
          test -f comet-pin/contracts/CometConfiguration.sol
          test -f comet-pin/contracts/AssetList.sol
          test -f comet-pin/contracts/AssetListFactory.sol
      - name: Checkout the deployed cUSDCv3 implementation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: compound-finance/comet
          ref: 059c11917f75049b41756d5c5fd44eb3dc716385
          path: comet-deployed
      - name: Verify the deployed Comet commit
        run: |
          set -euo pipefail
          test "$(git -C comet-deployed rev-parse HEAD)" = "059c11917f75049b41756d5c5fd44eb3dc716385"
          test -f comet-deployed/contracts/CometWithExtendedAssetList.sol
          test -f comet-deployed/contracts/IAssetListFactory.sol
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Install Foundry 1.8.5
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Install solc 0.8.28 and pinned solc 0.8.15
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.bugforge/solc/0.8.15"
          # PATH keeps 0.8.28 so the executor can see a solc binary.
          # The campaign resolves 0.8.15 from the BugForge compiler root and does not
          # substitute it when the source requests Cancun.
          url28="https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.28+commit.7893614a"
          expected28="9a0fb7e0db2c0641dbae1c5cc645dc686820c83af516226abb1c0a2f76636f25"
          curl -fsSL -o "$HOME/.local/bin/solc" "$url28"
          echo "${expected28}  $HOME/.local/bin/solc" | sha256sum -c -
          chmod 755 "$HOME/.local/bin/solc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          url15="https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.15+commit.e14f2714"
          expected15="5189155ce322d57fb75e8518d9b39139627edea4fb25b5f0ebed0391c52e74cc"
          curl -fsSL -o "$HOME/.bugforge/solc/0.8.15/solc" "$url15"
          echo "${expected15}  $HOME/.bugforge/solc/0.8.15/solc" | sha256sum -c -
          chmod 755 "$HOME/.bugforge/solc/0.8.15/solc"
          "$HOME/.bugforge/solc/0.8.15/solc" --version | grep "0.8.15"
      - name: Run the pinned Compound integration tests
        working-directory: backend
        env:
          BUGFORGE_COMET_ROOT: ${{ github.workspace }}/comet-pin
          BUGFORGE_COMET_DEPLOYED_ROOT: ${{ github.workspace }}/comet-deployed
          BUGFORGE_REQUIRE_COMET: "1"
          BUGFORGE_REQUIRE_FOUNDRY: "1"
          FOUNDRY_OFFLINE: "true"
          FOUNDRY_FFI: "false"
        run: |
          pytest \
            tests/test_phase58/test_comet_pause_campaign.py \
            tests/test_phase59/test_comet_asset_campaign.py \
            tests/test_phase59/test_ci_comet_required.py \
            tests/test_compound_custody \
            -vv --tb=short

  yearn-integration:
    name: Yearn source replay (pinned 3.0.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned Yearn Tokenized Strategy 3.0.4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yearn/tokenized-strategy
          ref: 82806289f967590c4efbf6bc3d237e4e7f0a0966
          path: yearn-pin
      - name: Verify the pinned Yearn commit
        run: |
          set -euo pipefail
          test "$(git -C yearn-pin rev-parse HEAD)" = "82806289f967590c4efbf6bc3d237e4e7f0a0966"
          test -f yearn-pin/src/TokenizedStrategy.sol
          test -f yearn-pin/src/BaseStrategy.sol
      - name: Checkout pinned OpenZeppelin v4.9.5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenZeppelin/openzeppelin-contracts
          ref: bd325d56b4c62c9c5c1aff048c37c6bb18ac0290
          path: oz-pin
      - name: Verify the pinned OpenZeppelin commit
        run: |
          set -euo pipefail
          test "$(git -C oz-pin rev-parse HEAD)" = "bd325d56b4c62c9c5c1aff048c37c6bb18ac0290"
          test -f oz-pin/contracts/token/ERC20/ERC20.sol
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install Python dependencies
        working-directory: backend
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Install Foundry 1.8.5
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Install pinned solc 0.8.18
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bugforge/solc/0.8.18" "$HOME/.local/bin"
          # Published checksum from https://binaries.soliditylang.org/linux-amd64/list.json
          url="https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.18+commit.87f61d96"
          expected="95e6ed4949a63ad89afb443ecba1fb8302dd2860ee5e9baace3e674a0f48aa77"
          curl -fsSL -o "$HOME/.bugforge/solc/0.8.18/solc" "$url"
          echo "${expected}  $HOME/.bugforge/solc/0.8.18/solc" | sha256sum -c -
          chmod 755 "$HOME/.bugforge/solc/0.8.18/solc"
          "$HOME/.bugforge/solc/0.8.18/solc" --version | grep "0.8.18"
          # PATH still needs a solc so the executor's tool check can see one.
          cp "$HOME/.bugforge/solc/0.8.18/solc" "$HOME/.local/bin/solc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the pinned Yearn source-replay test
        working-directory: backend
        env:
          BUGFORGE_YEARN_ROOT: ${{ github.workspace }}/yearn-pin
          BUGFORGE_OZ_ROOT: ${{ github.workspace }}/oz-pin
          BUGFORGE_REQUIRE_YEARN: "1"
          BUGFORGE_YEARN_EXECUTE: "1"
          BUGFORGE_REQUIRE_FOUNDRY: "1"
          FOUNDRY_OFFLINE: "true"
          FOUNDRY_FFI: "false"
        run: |
          pytest tests/test_phase64/test_yearn_replay.py -vv --tb=short
