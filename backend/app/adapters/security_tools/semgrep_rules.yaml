rules:
  - id: bugforge.solidity.tx-origin
    languages: [solidity]
    message: Authorization compares tx.origin. This is untrusted static evidence.
    severity: WARNING
    pattern: tx.origin
  - id: bugforge.solidity.delegatecall
    languages: [solidity]
    message: delegatecall is present. This is untrusted static evidence.
    severity: WARNING
    pattern: $T.delegatecall(...)
  - id: bugforge.solidity.low-level-call
    languages: [solidity]
    message: Low-level call is present. This is untrusted static evidence.
    severity: INFO
    pattern: $T.call(...)
